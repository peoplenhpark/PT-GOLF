<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFC"/><stop offset="1" stop-color="#E9F1EF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0982A" stop-opacity="0.42"/><stop offset="1" stop-color="#E0982A" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#22332F" flood-opacity="0.20"/></filter>
</defs>
<rect x="2" y="2" width="476" height="296" rx="20" fill="url(#bg)" stroke="#DBE5E2" stroke-width="2"/>
<text x="28" y="42" font-size="19" font-weight="700" fill="#2B3A36">데드버그 · 「반쯤」까지만</text>
<line x1="28" y1="54" x2="452" y2="54" stroke="#E4EBE9" stroke-width="2"/>
<text x="40" y="92" font-size="17.5" font-weight="600" fill="#2B3A36">팔·다리를 끝까지 펴지 마세요</text>
<text x="40" y="114" font-size="15.6" fill="#6E807B">반쯤(약 40%)만 내려갔다 올라오기</text>
<text x="40" y="132" font-size="15.6" fill="#6E807B">허리와 바닥 사이가 뜨기 직전까지</text>
<text x="40" y="150" font-size="15.6" fill="#6E807B">짧게 해야 배가 일한다 · 범위는 나중에</text>
<rect x="60" y="252" width="360" height="9" rx="4.5" fill="#CBD8D3"/>
<ellipse cx="188" cy="228" rx="46" ry="26" fill="url(#glow)"/>
<line x1="150" y1="236" x2="114" y2="176" stroke="#B8C4C1" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="214" y1="238" x2="304" y2="176" stroke="#B8C4C1" stroke-width="3" stroke-dasharray="6 5"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="98" y1="240" x2="214" y2="242" stroke="#516C66" stroke-width="28"/>
  <line x1="150" y1="238" x2="130" y2="202" stroke="#5EA093" stroke-width="13"/>
  <line x1="214" y1="240" x2="248" y2="200" stroke="#5EA093" stroke-width="22"/>
  <line x1="248" y1="200" x2="288" y2="208" stroke="#5EA093" stroke-width="14"/>
  <line x1="150" y1="240" x2="184" y2="244" stroke="#6A8781" stroke-width="12"/>
  <line x1="214" y1="242" x2="300" y2="246" stroke="#607D77" stroke-width="22"/>
  <circle cx="80" cy="232" r="18" fill="#516C66"/>
  <circle cx="214" cy="241" r="14" fill="#516C66"/>
</g>
<circle cx="292" cy="209" r="8" fill="#E4572E"/>
<circle cx="126" cy="199" r="7" fill="#E4572E"/>
<text x="312" y="230" font-size="15.6" font-weight="700" fill="#E4572E">여기까지만</text>
<text x="312" y="170" font-size="14.3" font-weight="700" fill="#98A6A2">✗ 끝까지 펴면</text>
<text x="312" y="188" font-size="14.3" font-weight="700" fill="#98A6A2">허리가 뜬다</text>
<rect x="360" y="28" width="92" height="24" rx="12" fill="#EAF3F1" stroke="#CBDCD7"/>
<text x="406" y="45" font-size="12.5" font-weight="700" fill="#14776A" text-anchor="middle">범위 40%</text>
</svg>
