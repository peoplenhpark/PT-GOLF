  <circle cx="238" cy="258" r="13" fill="#607D77"/>
  <circle cx="244" cy="162" r="16" fill="#516C66"/>
</g>
<rect x="196" y="188" width="26" height="34" rx="7" fill="#E6A23C" stroke="#C9871F" stroke-width="2"/>
<line x1="300" y1="230" x2="336" y2="242" stroke="#E4572E" stroke-width="5" stroke-linecap="round"/>
