<text x="332" y="222" font-size="15.6" font-weight="700" fill="#E4572E">엉덩이만 뒤로</text>
<text x="40" y="196" font-size="14.3" font-weight="700" fill="#3D8A7C">등으로 버티기</text>
<text x="40" y="252" font-size="14.3" font-weight="700" fill="#3D8A7C">발바닥에서 밀어 올린다</text>
<rect x="336" y="28" width="116" height="24" rx="12" fill="#EAF3F1" stroke="#CBDCD7"/>
