<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFC"/><stop offset="1" stop-color="#E7F0F6"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0982A" stop-opacity="0.45"/><stop offset="1" stop-color="#E0982A" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22332F" flood-opacity="0.18"/></filter>
</defs>
<rect x="2" y="2" width="476" height="296" rx="20" fill="url(#bg)" stroke="#D6E2EA" stroke-width="2"/>
<text x="28" y="38" font-size="18" font-weight="700" fill="#22405A">아이언 · 스윙 4스텝</text>
<text x="28" y="58" font-size="14" fill="#5A7286">준비 = 골반 접기(힙힌지)로 견고하게</text>
<line x1="28" y1="70" x2="452" y2="70" stroke="#DCE7EE" stroke-width="2"/>
<line x1="26" y1="232" x2="454" y2="232" stroke="#C6D4DD" stroke-width="5" stroke-linecap="round"/>

<!-- 준비 -->
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="66" y1="232" x2="76" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="86" y1="232" x2="76" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="76" y1="200" x2="82" y2="166" stroke="#516C66" stroke-width="12"/>
  <line x1="82" y1="170" x2="88" y2="192" stroke="#6A8781" stroke-width="7"/>
  <circle cx="86" cy="156" r="8" fill="#516C66"/>
</g>
<line x1="88" y1="192" x2="96" y2="228" stroke="#3A4038" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="99" cy="230" r="4" fill="#E6A23C" stroke="#C9871F" stroke-width="1.5"/>
<text x="76" y="258" font-size="14.5" font-weight="700" fill="#22405A" text-anchor="middle">준비</text>
<text x="76" y="276" font-size="12.5" fill="#5A7286" text-anchor="middle">골반 접기</text>

<!-- 1 백스윙 -->
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="150" y1="232" x2="160" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="170" y1="232" x2="160" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="160" y1="200" x2="164" y2="166" stroke="#516C66" stroke-width="12"/>
  <line x1="164" y1="170" x2="176" y2="180" stroke="#6A8781" stroke-width="7"/>
  <circle cx="168" cy="156" r="8" fill="#516C66"/>
</g>
<line x1="176" y1="180" x2="198" y2="140" stroke="#3A4038" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 186 196 A 34 34 0 0 1 200 150" fill="none" stroke="#E4572E" stroke-width="3" stroke-dasharray="5 4"/>
<text x="160" y="258" font-size="14.5" font-weight="700" fill="#22405A" text-anchor="middle">① 백스윙</text>

<!-- 2 체중이동 -->
<ellipse cx="234" cy="222" rx="26" ry="16" fill="url(#glow)"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="230" y1="232" x2="246" y2="200" stroke="#5EA093" stroke-width="10"/>
  <line x1="256" y1="232" x2="246" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="246" y1="200" x2="248" y2="166" stroke="#516C66" stroke-width="12"/>
  <line x1="248" y1="170" x2="260" y2="180" stroke="#6A8781" stroke-width="7"/>
  <circle cx="252" cy="156" r="8" fill="#516C66"/>
</g>
<line x1="260" y1="180" x2="282" y2="142" stroke="#3A4038" stroke-width="3.5" stroke-linecap="round"/>
<line x1="264" y1="216" x2="234" y2="216" stroke="#E4572E" stroke-width="4" stroke-linecap="round"/>
<polygon points="228,216 240,210 240,222" fill="#E4572E"/>
<text x="246" y="258" font-size="14.5" font-weight="700" fill="#22405A" text-anchor="middle">② 체중이동</text>
<text x="246" y="276" font-size="12.5" fill="#5A7286" text-anchor="middle">왼쪽으로</text>

<!-- 3 면 타격 (아이언: 클럽 면으로 눌러 치기) -->
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="318" y1="232" x2="330" y2="200" stroke="#5EA093" stroke-width="10"/>
  <line x1="342" y1="232" x2="330" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="330" y1="200" x2="334" y2="166" stroke="#516C66" stroke-width="12"/>
  <line x1="334" y1="172" x2="342" y2="192" stroke="#6A8781" stroke-width="7"/>
  <circle cx="338" cy="156" r="8" fill="#516C66"/>
</g>
<line x1="342" y1="192" x2="352" y2="228" stroke="#3A4038" stroke-width="3.5" stroke-linecap="round"/>
<line x1="346" y1="226" x2="360" y2="232" stroke="#3A4038" stroke-width="5" stroke-linecap="round"/>
<circle cx="358" cy="224" r="4" fill="#E6A23C" stroke="#C9871F" stroke-width="1.5"/>
<line x1="366" y1="200" x2="360" y2="218" stroke="#E4572E" stroke-width="4.5" stroke-linecap="round"/>
<polygon points="358,222 356,209 367,213" fill="#E4572E"/>
<text x="332" y="258" font-size="14.5" font-weight="700" fill="#22405A" text-anchor="middle">③ 면 타격</text>
<text x="332" y="276" font-size="12.5" font-weight="600" fill="#C9871F" text-anchor="middle">클럽 면으로</text>

<!-- 4 임팩트 확인 -->
<line x1="418" y1="128" x2="418" y2="236" stroke="#8FA6B4" stroke-width="2" stroke-dasharray="5 5"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="404" y1="232" x2="416" y2="200" stroke="#5EA093" stroke-width="10"/>
  <line x1="428" y1="232" x2="416" y2="200" stroke="#607D77" stroke-width="9"/>
  <line x1="416" y1="200" x2="418" y2="166" stroke="#516C66" stroke-width="12"/>
  <line x1="418" y1="174" x2="424" y2="194" stroke="#6A8781" stroke-width="7"/>
  <circle cx="420" cy="156" r="8" fill="#516C66"/>
</g>
<line x1="424" y1="194" x2="410" y2="228" stroke="#3A4038" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="420" cy="156" r="14" fill="none" stroke="#E4572E" stroke-width="2.5"/>
<text x="418" y="258" font-size="14.5" font-weight="700" fill="#22405A" text-anchor="middle">④ 임팩트</text>
<text x="418" y="276" font-size="12.5" fill="#5A7286" text-anchor="middle">머리·중심 유지</text>
</svg>
