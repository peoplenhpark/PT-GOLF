<text x="150" y="292" font-size="14.3" font-weight="700" fill="#E4572E">꼬리뼈 눌렀다 ↔ 말아 올리기</text>
<text x="40" y="92" font-size="17.5" font-weight="600" fill="#2B3A36">다리 직각 · 팔은 앞으로 나란히</text>
<text x="40" y="114" font-size="15.6" fill="#6E807B">턱 당기고 몸을 응축 → 척추 정렬 만들기</text>
<text x="40" y="132" font-size="15.6" fill="#6E807B">허벅지 안쪽으로 살짝 열면 엉덩이 힘 쉬움</text>
<text x="40" y="150" font-size="15.6" fill="#6E807B">많이 안 움직여도 됨 · 허리가 뜨면 안 됨</text>
