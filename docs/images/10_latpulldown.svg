<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFC"/><stop offset="1" stop-color="#E9F1EF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0982A" stop-opacity="0.45"/><stop offset="1" stop-color="#E0982A" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#22332F" flood-opacity="0.20"/></filter>
</defs>
<rect x="2" y="2" width="476" height="296" rx="20" fill="url(#bg)" stroke="#DBE5E2" stroke-width="2"/>
<text x="28" y="42" font-size="19" font-weight="700" fill="#2B3A36">랫풀다운 · 3층 세팅</text>
<line x1="28" y1="54" x2="452" y2="54" stroke="#E4EBE9" stroke-width="2"/>
<text x="40" y="88" font-size="17.5" font-weight="600" fill="#2B3A36">①까치발 ②가슴 내밀기 ③뒤로 살짝</text>
<text x="40" y="110" font-size="15.6" fill="#6E807B">이 척추 기준선은 끝까지 흔들리지 않게</text>
<text x="40" y="132" font-size="15.6" fill="#6E807B">팔꿈치를 안으로 · 턱 바로 밑까지만</text>
<rect x="40" y="290" width="410" height="8" rx="4" fill="#CBD8D3"/>
<line x1="280" y1="146" x2="280" y2="180" stroke="#8894A0" stroke-width="3"/>
<line x1="230" y1="184" x2="330" y2="184" stroke="#3A4038" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="282" cy="236" rx="42" ry="30" fill="url(#glow)"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="280" y1="226" x2="284" y2="262" stroke="#516C66" stroke-width="28"/>
  <line x1="270" y1="228" x2="240" y2="190" stroke="#6A8781" stroke-width="13"/>
  <line x1="294" y1="228" x2="322" y2="190" stroke="#6A8781" stroke-width="13"/>
  <line x1="284" y1="262" x2="332" y2="268" stroke="#607D77" stroke-width="22"/>
  <line x1="332" y1="268" x2="340" y2="286" stroke="#607D77" stroke-width="18"/>
  <line x1="340" y1="286" x2="354" y2="290" stroke="#607D77" stroke-width="11"/>
  <circle cx="280" cy="206" r="16" fill="#516C66"/>
</g>
<rect x="248" y="266" width="72" height="12" rx="5" fill="#B9C9C4" stroke="#A5B8B2" stroke-width="2"/>
<text x="30" y="196" font-size="14.3" font-weight="700" fill="#E4572E">① 까치발로 골반 고정</text>
<text x="30" y="222" font-size="14.3" font-weight="700" fill="#E4572E">② 가슴 앞으로 내밀기</text>
<text x="30" y="248" font-size="14.3" font-weight="700" fill="#E4572E">③ 뒤로 살짝 제끼기</text>
<text x="356" y="200" font-size="14.3" font-weight="700" fill="#3D8A7C">턱 밑까지만</text>
<text x="368" y="288" font-size="14.3" font-weight="700" fill="#3D8A7C">까치발</text>
<rect x="360" y="28" width="92" height="24" rx="12" fill="#EAF3F1" stroke="#CBDCD7"/>
<text x="406" y="45" font-size="12.5" font-weight="700" fill="#14776A" text-anchor="middle">척추 운동</text>
</svg>
