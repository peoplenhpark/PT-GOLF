<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFC"/><stop offset="1" stop-color="#E9F1EF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0982A" stop-opacity="0.45"/><stop offset="1" stop-color="#E0982A" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#22332F" flood-opacity="0.20"/></filter>
</defs>
<rect x="2" y="2" width="476" height="296" rx="20" fill="url(#bg)" stroke="#DBE5E2" stroke-width="2"/>
<text x="28" y="42" font-size="19" font-weight="700" fill="#2B3A36">브릿지 (Bridge) · 핵심 자세</text>
<line x1="28" y1="54" x2="452" y2="54" stroke="#E4EBE9" stroke-width="2"/>
<rect x="60" y="252" width="360" height="10" rx="5" fill="#CBD8D3"/>
<ellipse cx="248" cy="176" rx="52" ry="30" fill="url(#glow)"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="120" y1="244" x2="212" y2="212" stroke="#516C66" stroke-width="28"/>
  <line x1="212" y1="212" x2="286" y2="180" stroke="#607D77" stroke-width="26"/>
  <line x1="286" y1="180" x2="322" y2="246" stroke="#607D77" stroke-width="24"/>
  <line x1="322" y1="246" x2="352" y2="248" stroke="#607D77" stroke-width="14"/>
  <line x1="150" y1="238" x2="196" y2="248" stroke="#6A8781" stroke-width="13"/>
  <circle cx="286" cy="180" r="15" fill="#607D77"/>
  <circle cx="100" cy="248" r="17" fill="#516C66"/>
</g>
<line x1="272" y1="146" x2="272" y2="166" stroke="#E4572E" stroke-width="5.5" stroke-linecap="round"/>
<polygon points="272,141 266,153 278,153" fill="#E4572E"/>
<text x="150" y="112" font-size="17.5" font-weight="600" fill="#2B3A36">순서: 엉덩이 → 가슴 → 엉덩이 쪼기</text>
<text x="150" y="130" font-size="15.6" fill="#6E807B">무릎은 벌어진 상태 유지 · 힘은 엉덩이에</text>
<text x="44" y="286" font-size="15.6" fill="#6E807B">뒤꿈치는 골반 라인 · 앞꿈치 살짝 팔자 · 닿기 전에 다시</text>
<rect x="360" y="28" width="92" height="24" rx="12" fill="#EAF3F1" stroke="#CBDCD7"/>
<text x="406" y="45" font-size="12.5" font-weight="700" fill="#14776A" text-anchor="middle">추천</text>
</svg>
