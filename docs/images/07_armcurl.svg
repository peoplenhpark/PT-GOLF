<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFC"/><stop offset="1" stop-color="#E9F1EF"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0982A" stop-opacity="0.42"/><stop offset="1" stop-color="#E0982A" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#22332F" flood-opacity="0.20"/></filter>
</defs>
<rect x="2" y="2" width="476" height="296" rx="20" fill="url(#bg)" stroke="#DBE5E2" stroke-width="2"/>
<text x="28" y="42" font-size="19" font-weight="700" fill="#2B3A36">바벨 컬 · 원판이 「일자」로</text>
<line x1="28" y1="54" x2="452" y2="54" stroke="#E4EBE9" stroke-width="2"/>
<text x="40" y="92" font-size="17.5" font-weight="600" fill="#2B3A36">팔꿈치를 뒤로 당겨 몸에 붙인 채</text>
<text x="40" y="114" font-size="15.6" fill="#6E807B">안으로 넣어 끌어올리고 → 턱 앞까지</text>
<text x="40" y="132" font-size="15.6" fill="#6E807B">내릴 땐 앞으로 밀었다 뒤로 빼며 내리기</text>
<text x="40" y="150" font-size="15.6" fill="#6E807B">위 팔뚝 고정 · 손목 일자 · 내릴 때 다 펴기</text>
<rect x="150" y="280" width="220" height="9" rx="4.5" fill="#CBD8D3"/>
<ellipse cx="262" cy="222" rx="34" ry="28" fill="url(#glow)"/>
<g filter="url(#soft)" stroke-linecap="round">
  <line x1="250" y1="194" x2="256" y2="240" stroke="#516C66" stroke-width="28"/>
  <line x1="256" y1="240" x2="252" y2="276" stroke="#607D77" stroke-width="20"/>
  <line x1="252" y1="276" x2="272" y2="279" stroke="#607D77" stroke-width="11"/>
  <line x1="250" y1="198" x2="256" y2="224" stroke="#5EA093" stroke-width="14"/>
  <line x1="256" y1="224" x2="272" y2="250" stroke="#5EA093" stroke-width="13"/>
  <circle cx="256" cy="224" r="9" fill="#4E8D80"/>
  <circle cx="248" cy="178" r="16" fill="#516C66"/>
</g>
<path d="M 278 254 A 36 36 0 0 1 278 190" fill="none" stroke="#9AACA7" stroke-width="3.5" stroke-dasharray="6 5"/>
<circle cx="278" cy="254" r="13" fill="#E6A23C" stroke="#C9871F" stroke-width="2"/>
<circle cx="278" cy="190" r="13" fill="none" stroke="#C9871F" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="278" y1="240" x2="278" y2="206" stroke="#E4572E" stroke-width="5" stroke-linecap="round"/>
<polygon points="278,200 272,213 284,213" fill="#E4572E"/>
<text x="330" y="200" font-size="14.3" font-weight="700" fill="#E4572E">✓ 원판이 일자로</text>
<text x="330" y="236" font-size="14.3" font-weight="700" fill="#8894A0">✗ 반원 궤적</text>
<rect x="360" y="28" width="92" height="24" rx="12" fill="#EAF3F1" stroke="#CBDCD7"/>
<text x="406" y="45" font-size="12.5" font-weight="700" fill="#14776A" text-anchor="middle">궤적 핵심</text>
</svg>
