<text x="286" y="182" font-size="14.3" font-weight="700" fill="#E4572E">앞발 쪽으로 흉추 회전</text>
<text x="118" y="236" font-size="14.3" font-weight="700" fill="#3D8A7C">뒷발 까치발</text>
<text x="40" y="92" font-size="17.5" font-weight="600" fill="#2B3A36">① 돌리고 → ② 앉고 → ③ 일어나 제자리</text>
<text x="40" y="114" font-size="15.6" fill="#6E807B">엉덩이를 「철컥」 장전하듯 뒤로 빼며 앉기</text>
<text x="40" y="132" font-size="15.6" fill="#6E807B">무릎이 아니라 골반을 쓴다 (프로포즈 자세)</text>
