<line x1="196" y1="232" x2="160" y2="240" stroke="#E4572E" stroke-width="5" stroke-linecap="round"/>
<polygon points="154,241 168,235 167,247" fill="#E4572E"/>
<line x1="284" y1="232" x2="320" y2="240" stroke="#E4572E" stroke-width="5" stroke-linecap="round"/>
<polygon points="326,241 312,235 313,247" fill="#E4572E"/>
<text x="40" y="196" font-size="15.6" font-weight="700" fill="#E4572E">무릎 = 발끝 방향</text>
